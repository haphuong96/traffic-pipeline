services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5434:5432"
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana
    ports:
      - "4000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
