services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5434:5432"
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana
    ports:
      - "4000:3000"
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    mem_limit: 1g
    volumes:
      # Keep the log on a named volume so `docker compose down` doesn't
      # delete it (replay is one of the reasons we chose Kafka).
      - kafkadata:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by kafka-init, so a typo in a topic
      # name fails loudly instead of silently creating a new 1-partition topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Default retention is 7 days. At 40k devices (~100k messages/min) that
      # is far more disk than this machine has. 24 h is plenty for replay.
      KAFKA_LOG_RETENTION_HOURS: 24
      # Fit the Java heap inside mem_limit, leaving room for the page cache.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot job: creates the topics, then exits. Safe to re-run
  # (--if-not-exists). 6 partitions = up to 6 consumers reading in parallel;
  # producers key messages by deviceId so each device's readings stay in order.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "readings", "--partitions", "6", "--replication-factor", "1"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
